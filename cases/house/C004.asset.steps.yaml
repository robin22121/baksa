# C004 자산 입력(실제 저장): 리허설(215306)과 같은 입력 → 계산(U4: 저장까지 함) → 환산취득가액·개산공제 읽기 → 필요경비 창에 양도비 3,000,000 → 다시 계산 → 저장.
