# C002 자산 입력(실제 저장): 세율구분은 기본값 "일반과세" 그대로 둔다.
# 근거(W1 관찰, 2026-10-28): `1세대2주택` 선택 → 모달 "…2022.5.10~2026.5.9 양도 시 중과 미적용 … 「일반과세」를 적용하시겠습니까?" → 예 → 세율구분이 "일반과세"로 돌아감(C002_W1_probe_yes.png).
# 즉 유예기간 안 양도의 최종 입력 상태는 일반과세와 같다. 콤보 조작 결함(F7) 때문에 실제 저장에서는 콤보를 건드리지 않는다.
