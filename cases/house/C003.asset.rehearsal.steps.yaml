# C003 자산 리허설: 아파트 폼에 C003 값 + 세율구분 `1세대2주택`(중과) → 계산 앞에서 저장 없이 닫는다(U4).
# 모달: "「일반과세」를 적용하시겠습니까?"(C002 W1 관찰) → 아니오(유예 종료 후 양도), 이어지는 창 "중과되는 주택이 맞습니까?" → 예. 뜨지 않으면 기록.
# 전제: 가상양도인4(0004) 선택 상태. 값 근거: docs/work-plans/2026-10-29-C003-조정2주택-중과.md §0
window: 양도소득세
steps:
  - press: 2. 자 산 등 록
  - press_id: btnS53                       # 아 파 트 / 연립·다세대
    opens: 실지거래>아파트·연립주택
  - radio_id: rgCHK1                       # 취득실가를 아는 경우
  - click_id: CC02
    opens: 주소검색
  - text: {id: emSearch, value: 학동로 426}
  - press_id: btnSearch
    opens: 주소검색
  - read: [txtResultJuso]
  - press_id: btnOk
    screens: {아파트·연립주택공동주택가격조회: "@close"}   # 1차(234807): 강남구청 주소 확인 뒤 자동으로 열림(C001 마포구청에서는 없음) — 닫는다
  - window: 실지거래>아파트·연립주택
  - read: [CC02]
  - text: {id: CC06, value: "2026-07-20", type: Pane}   # 양도일자
  - text: {id: CC11, value: "2015-03-10", type: Pane}   # 취득일자
  - text: {id: CC04, value: "84"}                       # 전용면적(가상)
  - capture: basic_filled
  - combo: {id: GU, value: 1세대2주택}
    modals: {"확인|*일반과세」를적용하시겠습니까*": 아니오}
    screens: {확인: 예}
  - capture: gu_selected
  - read: [GU]
  - text: {id: S01, value: "900000000"}                 # 양도실가
    screens: {취득실가: "@close", 필요경비: "@close", 확인: 예}
    modals: {"확인|*일반과세」를적용하시겠습니까*": 아니오}
  - press_id: btnS02
    opens: 취득실가
  - text: {id: S11, value: "500000000"}                 # 매입가격
  - text: {id: S12, value: "5500000"}                   # 취득세 등(임의값)
  - read: [ST]
  - capture: acq
  - press_id: btnOK
  - window: 실지거래>아파트·연립주택
  - press_id: btnS03
    opens: 필요경비
  - click_id: S41
  # 3차(235202): 거래처 입력 뒤 포커스가 새 행으로 넘어가 지급일자가 둘째 행에 들어감 → 세액에 필요한 지급금액만 첫 행에 넣는다(⑩ 합계로 확인)
  - grid_cell: {grid: cxGrid1, row: 지급금액, value: "4000000", record: 0}
  - read: [S41, S1234T]
  - capture: exp
  - press_id: btnOK
  - window: 실지거래>아파트·연립주택
  - read: [S01, S02, S03, CC06, CC11, CC04, GU]
  - capture: before_calc
  - close: 실지거래>아파트·연립주택
    modals: {"*|*저장하시겠습니까*": 아니오}
  - press: 2. 자 산 등 록
  - verify_grid: {id: cxGrid1, column: 소재지, contains: 학동로, count: 0}
