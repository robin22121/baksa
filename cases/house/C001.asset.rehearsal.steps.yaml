  - grid_cell: {grid: cxGrid1, row: 거래처, value: 가상중개사무소, record: 0}
  - grid_cell: {grid: cxGrid1, row: 지급일자, value: "2025-08-20", record: 0}
  - grid_cell: {grid: cxGrid1, row: 지급금액, value: "6000000", record: 0}
  - read: [S41, S1234T]
  - capture: exp
  - press_id: btnOK
  - window: 실지거래>아파트·연립주택
