# C000 양수인 입력(실제 저장): 리허설(2026-10-22 2회 성공)과 같은 입력 + 저장. 칸 이름은 2026-10-22 덤프(.scratch/buyer2.png)
window: 양도소득세
vars:
  rrn_b: {fake_rrn: {birth: 1990-01-01, sex: F}}
steps:
  - press: 3. 양수인 등록
  - press_id: btnReg
    expect_enabled: [저장, 취소]
  - text: {id: eName, value: 가상양수인}
  - text: {id: eJumin, value: "{rrn_b}"}
  - combo: {id: eAddr, value: "서울특별시 마포구 월드컵로 212 (성산동, 마포구청, 370)"}   # 양도자산 소재지: 자산 주소 전체 문자열(리허설 1차에서 부분 문자열은 양도자산 칸이 비었음)
  - read: [eJasan, eNative, eJibun, eTotalJibun]
  - text: {id: eJibun, value: "100"}                  # 양수지분
  - text: {id: eTotalJibun, value: "100"}             # 전체지분
  - capture: buyer_filled
  - press_id: btnSave
    expect_disabled: [저장, 취소]
    modals: {}                    # 처음 보는 모달이면 멈춘다
  - capture: buyer_saved
  - press: 3. 양수인 등록
  - verify_grid: {id: cxGrid1, column: 성명, contains: 가상양수인, count: 1}
